# Local Postgres for development.
#
#   docker compose up -d      start it (first run downloads the image)
#   docker compose down       stop it, keeping the data
#   docker compose down -v    stop it and DELETE the data
#
# The named volume is the important part: without it, removing the container
# would take every recipe with it.

services:
  db:
    image: postgres:16
    container_name: mise-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mise
      POSTGRES_PASSWORD: mise
      POSTGRES_DB: mise
    ports:
      - "5432:5432"
    volumes:
      - mise-data:/var/lib/postgresql/data
    healthcheck:
      # Lets `docker compose up --wait` block until Postgres actually accepts
      # connections, rather than just until the container has started.
      test: ["CMD-SHELL", "pg_isready -U mise -d mise"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mise-data:
